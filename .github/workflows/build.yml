name: Build Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ldid xz

      - name: Prepare armv7 SDK
        run: |
          mkdir -p $HOME/theos/sdks
          curl -L -o sdks.zip https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q sdks.zip
          cp -R sdks-master/iPhoneOS10.3.sdk $HOME/theos/sdks/
          find $HOME/theos/sdks/iPhoneOS10.3.sdk -name "module.map" -exec sh -c 'mv "$1" "$(dirname "$1")/module.modulemap"' _ {} \;

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Build package
        run: |
          export THEOS=$HOME/theos
          make package FINALPACKAGE=1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: packages/*.deb

      - name: Create release
        uses:
